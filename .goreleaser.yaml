version: 2
builds:
  - env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags: -s -w
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
changelog:
  use: github
brews:
  - repository:
      owner: nobu666
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/nobu666/mcp-exposure
    description: "List the MCP servers registered on this machine and how each one is exposed"
    license: MIT
    test: |
      system "#{bin}/mcp-exposure", "--help"
